# The three test suites from the README, on the platform Defalt ships for.
name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python ${{ matrix.python }} (${{ matrix.requirements }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest supported Python, with the ranges people install
          - python: "3.11"
            requirements: requirements.txt
          # the pinned set the app is developed against
          - python: "3.13"
            requirements: requirements.lock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - name: ffmpeg
        run: choco install ffmpeg --no-progress -y
      - name: install
        run: python -m pip install -r ${{ matrix.requirements }}
      - name: unittest
        run: |
          $env:PATH = "C:\ProgramData\chocolatey\bin;$env:PATH"
          ffmpeg -version | Select-Object -First 1
          python -m unittest discover -s tests -t .

  browser:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: browser tests
        run: node tests/run-browser.js

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # soundcheck needs a real output device, which a CI runner does not have
      - name: cargo test
        run: cargo test --bin defalt -- --skip soundcheck
